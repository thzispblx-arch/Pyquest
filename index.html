{id:'variables',level:'easy',number:2,title:'Variáveis, tipos e print',subtitle:'Guarde informações, entenda os tipos e mostre resultados na tela.',duration:'15 min',source:false,icon:'📦',sections:[
{title:'1. O que é uma variável?',body:'Variável é como uma caixinha com nome onde guardamos um valor. O sinal `=` significa atribuição: coloque o valor da direita dentro do nome que está à esquerda.',code:'nome = "Ana"\nidade = 18\naltura = 1.65\nativo = True\n\nprint(nome)\nprint(idade)'},
{title:'2. Tipos mais comuns',body:'`int` é número inteiro; `float` é número com casas decimais; `str` é texto; `bool` é verdadeiro ou falso. Texto precisa ficar entre aspas. Em Python, `True` e `False` começam com letra maiúscula.',code:'idade = 18        # int\npreco = 9.90      # float\nnome = "Bia"      # str\naprovado = True   # bool\n\nprint(type(idade))  # <class \'int\'>'},
{title:'3. print e input',body:'`print()` mostra algo na tela. `input()` faz uma pergunta e recebe o que a pessoa digitou. Atenção: `input()` sempre devolve texto. Para fazer conta com a resposta, converta usando `int()` ou `float()`.',code:'nome = input("Qual seu nome? ")\nidade = int(input("Qual sua idade? "))\nprint("Olá", nome)\nprint("Ano que vem:", idade + 1)',box:'Não confunda: `=` guarda um valor. `==` compara se dois valores são iguais.',boxType:'yellow'}],questions:[
{type:'mcq',q:'Qual comando mostra uma mensagem na tela?',options:['input()','print()','type()','int()'],answer:1,why:'print() exibe texto, números ou o resultado de uma expressão.'},
{type:'mcq',q:'Qual é o tipo de "Python"?',options:['int','float','str','bool'],answer:2,why:'Tudo que está entre aspas é uma string (str), ou seja, texto.'},
{type:'predict',q:'O que aparece?',code:'idade = 18\nidade = idade + 1\nprint(idade)',answer:'19',why:'A variável recebe 18 e, na linha seguinte, passa a guardar 19.'}]},
{id:'conditions',level:'easy',number:3,title:'Decisões: if, elif e else',subtitle:'Ensine o programa a escolher caminhos diferentes.',duration:'15 min',source:false,icon:'🚦',sections:[
{title:'1. if: se acontecer...',body:'`if` testa uma condição. Se ela for verdadeira (`True`), o bloco indentado será executado. Os dois-pontos `:` são obrigatórios e o código dentro do bloco precisa estar recuado.',code:'idade = 18\n\nif idade >= 18:\n    print("Maior de idade")'},
{title:'2. else e elif',body:'`else` é o caminho alternativo quando o `if` não é verdadeiro. `elif` permite testar outra condição antes de chegar ao `else`. O Python avalia de cima para baixo.',code:'nota = 7\n\nif nota >= 9:\n    print("Excelente")\nelif nota >= 6:\n    print("Aprovado")\nelse:\n    print("Precisa estudar")'},
{title:'3. Operadores de comparação e lógica',body:'`==` igual; `!=` diferente; `>` maior; `<` menor; `>=` maior ou igual; `<=` menor ou igual. `and` exige que as duas condições sejam verdadeiras; `or` aceita pelo menos uma; `not` inverte o resultado.',code:'idade = 20\npossui_ingresso = True\n\nif idade >= 18 and possui_ingresso:\n    print("Pode entrar")\nelse:\n    print("Não pode entrar")',box:'Atenção à diferença: `if idade = 18` está errado. Para comparar, use `if idade == 18`.',boxType:'yellow'}],questions:[
{type:'mcq',q:'Qual símbolo compara se dois valores são iguais?',options:['=','==','!=','>='],answer:1,why:'Um = atribui. Dois == comparam.'},
{type:'predict',q:'Qual mensagem aparece?',code:'nota = 5\nif nota >= 6:\n    print("Passou")\nelse:\n    print("Estude mais")',answer:'Estude mais',why:'5 não é maior ou igual a 6. Então o bloco else é executado.'},
{type:'mcq',q:'O operador and exige que...',options:['Pelo menos uma condição seja verdadeira','As duas condições sejam verdadeiras','As duas sejam falsas','O programa pare'],answer:1,why:'and só resulta em True quando todas as condições ligadas por ele são verdadeiras.'}]},
{id:'loops',level:'easy',number:4,title:'Repetição: for, while e range',subtitle:'Faça o computador repetir tarefas sem escrever a mesma linha várias vezes.',duration:'18 min',source:false,icon:'🔁',sections:[
{title:'1. for: quando sei quantas vezes',body:'Use `for` para percorrer uma sequência ou repetir uma quantidade conhecida de vezes. `range(5)` gera 0, 1, 2, 3 e 4. O número final não entra na contagem.',code:'for numero in range(5):\n    print(numero)\n\n# Saída: 0 1 2 3 4'},
{title:'2. while: enquanto a condição for verdadeira',body:'`while` repete enquanto uma condição continuar verdadeira. É muito importante atualizar a variável de controle para que a condição fique falsa em algum momento. Caso contrário, pode acontecer um loop infinito.',code:'contador = 1\nwhile contador <= 3:\n    print(contador)\n    contador = contador + 1\n\n# Saída: 1, 2, 3',box:'Leia em voz alta: “enquanto contador for menor ou igual a 3, mostre e aumente 1”.',boxType:'green'},
{title:'3. break, continue e cuidado',body:'`break` encerra o laço imediatamente. `continue` pula o restante da repetição atual e vai para a próxima. Não use `while True` sem uma condição de saída, como um `break`.',code:'for n in range(1, 6):\n    if n == 3:\n        continue\n    print(n)\n# Mostra 1, 2, 4, 5'}],questions:[
{type:'predict',q:'Quais números são mostrados?',code:'for i in range(1, 4):\n    print(i)',answer:'1 2 3',why:'range(1, 4) começa em 1 e para antes de 4.'},
{type:'mcq',q:'Quando o while repete?',options:['Sempre exatamente 10 vezes','Enquanto a condição for verdadeira','Somente uma vez','Enquanto a condição for falsa'],answer:1,why:'O teste do while é feito antes de cada repetição.'},
{type:'mcq',q:'O que pode causar um loop infinito?',options:['Atualizar o contador','Usar print','Nunca tornar a condição do while falsa','Usar range'],answer:2,why:'Se a condição permanecer verdadeira para sempre, o laço não termina.'}]},
{id:'lists',level:'easy',number:5,title:'Listas: guardando vários valores',subtitle:'Crie coleções, acesse posições e entenda os índices.',duration:'16 min',source:true,sourceLabel:'Aula 10 — Introdução ao uso de listas',icon:'🧺',sections:[
{title:'1. O que é uma lista?',body:'Uma lista guarda vários valores em uma única variável. Ela é escrita com colchetes `[]`, e os itens são separados por vírgulas. Uma lista pode guardar textos, números ou até misturar tipos.',code:'frutas = ["maçã", "banana", "uva"]\nnotas = [8, 7.5, 9, 6]\n\nprint(frutas)'},
{title:'2. Índices: a posição de cada item',body:'Em Python, a primeira posição é o índice 0, não 1. Então `frutas[0]` pega o primeiro item. O índice `-1` pega o último. Tentar acessar uma posição que não existe causa `IndexError`.',code:'frutas = ["maçã", "banana", "uva"]\nprint(frutas[0])   # maçã\nprint(frutas[1])   # banana\nprint(frutas[-1])  # uva'},
{title:'3. Alterar, tamanho e fatiamento',body:'Você pode trocar um item usando seu índice. `len(lista)` informa quantos elementos existem. O fatiamento `lista[inicio:fim]` cria uma parte da lista; o índice final não é incluído. `lista[::-1]` é um atalho para obter os elementos na ordem inversa.',code:'numeros = [10, 20, 30, 40, 50]\nnumeros[1] = 99\nprint(len(numeros))   # 5\nprint(numeros[1:4])   # [99, 30, 40]\nprint(numeros[::-1])  # [50, 40, 30, 99, 10]',box:'Guarde: índice começa em zero; `[-1]` é o último elemento; no fatiamento, o final fica de fora.',boxType:'yellow'}],questions:[
{type:'predict',q:'O que aparece?',code:'cores = ["azul", "verde", "rosa"]\nprint(cores[0])',answer:'azul',why:'O índice 0 representa o primeiro elemento da lista.'},
{type:'mcq',q:'Como acessar o último elemento sem saber o tamanho da lista?',options:['lista[0]','lista[1]','lista[-1]','lista[10]'],answer:2,why:'O índice -1 representa o último item.'},
{type:'predict',q:'Qual é o resultado de len(valores)?',code:'valores = [2, 4, 6, 8]\nprint(len(valores))',answer:'4',why:'A lista contém quatro elementos.'}]},
{id:'methods',level:'medium',number:6,title:'Métodos de listas: adicionar e remover',subtitle:'Domine append, insert, extend, pop, remove e clear.',duration:'18 min',source:true,sourceLabel:'Aula 11 — Métodos de uma lista',icon:'🧰',sections:[
{title:'1. Adicionar elementos',body:'`append(item)` adiciona um item ao final. `insert(indice, item)` insere em uma posição específica. `extend(outra_lista)` adiciona todos os elementos de outra coleção ao final.',code:'nomes = ["Ana", "Bia"]\nnomes.append("Caio")\nnomes.insert(1, "Duda")\nnomes.extend(["Eva", "Leo"])\nprint(nomes)'},
{title:'2. Remover elementos',body:'`pop(indice)` remove e devolve o item daquela posição; sem índice, remove o último. `remove(item)` remove a primeira ocorrência do valor informado. `clear()` remove todos os elementos e deixa a lista vazia.',code:'numeros = [10, 20, 30, 20]\nremovido = numeros.pop()  # remove 20\nnumeros.remove(10)        # remove o 10\nprint(numeros)            # [20, 30]\nnumeros.clear()\nprint(numeros)            # []',box:'Pegadinha: `pop()` trabalha pela posição e retorna o item removido. `remove()` procura pelo valor.',boxType:'yellow'},
{title:'3. Acessar e procurar',body:'`lista[i]` acessa um índice. `index(item)` informa o índice da primeira ocorrência. `count(item)` conta quantas vezes o valor aparece. Se usar `index` com um item que não existe, ocorre `ValueError`.',code:'letras = ["a", "b", "a", "c"]\nprint(letras[1])       # b\nprint(letras.index("a")) # 0\nprint(letras.count("a")) # 2'},
{title:'4. Ordenação e inversão',body:'`sort()` ordena a própria lista em ordem crescente (ou alfabética). `sort(reverse=True)` ordena em ordem decrescente. `reverse()` apenas inverte a ordem atual, sem ordenar os valores.',code:'numeros = [4, 1, 3, 2]\nnumeros.sort()\nprint(numeros)  # [1, 2, 3, 4]\nnumeros.sort(reverse=True)\nprint(numeros)  # [4, 3, 2, 1]\nnumeros.reverse()  # inverte a ordem atual'},
{title:'5. Funções úteis e fatiamento',body:'`len()` conta elementos; `copy()` cria uma cópia superficial; `min()` e `max()` encontram menor e maior; `sum()` soma números. `lista[inicio:fim]` pega uma parte; `lista[::-1]` cria uma sequência invertida.',code:'valores = [5, 2, 9, 4]\nprint(len(valores))  # 4\nprint(min(valores))  # 2\nprint(max(valores))  # 9\nprint(sum(valores))  # 20\nprint(valores[::-1]) # [4, 9, 2, 5]'}],questions:[
{type:'mcq',q:'Qual método adiciona um item ao final da lista?',options:['insert()','append()','pop()','clear()'],answer:1,why:'append(item) coloca um novo elemento no final.'},
{type:'mcq',q:'Qual é a diferença entre pop() e remove()?',options:['Não existe diferença','pop remove pelo valor; remove pelo índice','pop remove pela posição e devolve o item; remove procura pelo valor','Os dois apagam a lista inteira'],answer:2,why:'Essa diferença é muito cobrada: pop usa índice; remove usa o valor.'},
{type:'predict',q:'Qual será a saída?',code:'lista = [3, 1, 2]\nlista.sort()\nprint(lista)',answer:'[1, 2, 3]',why:'sort() organiza a lista em ordem crescente e altera a própria lista.'},
{type:'text',q:'Qual método adiciona um item ao final da lista? Digite somente o nome, sem parênteses.',answer:'append',hint:'Começa com a letra a.'}]},
{id:'functions',level:'medium',number:7,title:'Funções: def, parâmetros e return',subtitle:'Crie seus próprios comandos e reutilize código.',duration:'18 min',source:true,sourceLabel:'Aula 12 — Funções (tópico indicado no material)',icon:'⚙️',sections:[
{title:'1. Para que serve uma função?',body:'Função é um bloco de código com um nome, criado para realizar uma tarefa. Ela evita repetir código e deixa o programa organizado. Em Python, usamos `def` para definir uma função.',code:'def saudacao():\n    print("Olá! Vamos estudar Python.")\n\nsaudacao()  # chamada da função'},
{title:'2. Parâmetros e argumentos',body:'Parâmetro é o nome que aparece na definição da função. Argumento é o valor que você entrega quando chama a função. Pense em uma função como uma máquina: você entrega dados, ela executa uma tarefa.',code:'def cumprimentar(nome):\n    print("Olá", nome)\n\ncumprimentar("João")  # João é o argumento'},
{title:'3. return não é a mesma coisa que print',body:'`print()` mostra algo na tela. `return` devolve um resultado para quem chamou a função. Se quiser guardar o resultado para usar depois, normalmente você precisa de `return`.',code:'def somar(a, b):\n    return a + b\n\nresultado = somar(3, 4)\nprint(resultado)  # 7',box:'Macete: def cria; chamar executa; parâmetro recebe; return devolve.',boxType:'green'},
{title:'4. Variáveis locais',body:'Uma variável criada dentro de uma função normalmente só pode ser usada dentro dela. Isso é chamado de escopo local. O código de fora não deve presumir que consegue acessar qualquer variável criada lá dentro.',code:'def mostrar():\n    mensagem = "Estou dentro da função"\n    print(mensagem)\n\nmostrar()'}],questions:[
{type:'mcq',q:'Qual palavra cria uma função em Python?',options:['function','fun','def','make'],answer:2,why:'A palavra-chave para definir uma função é def.'},
{type:'mcq',q:'Qual alternativa explica melhor print e return?',options:['Os dois fazem exatamente a mesma coisa','print mostra na tela; return devolve um valor','return mostra na tela e print devolve','Nenhum pode ser usado em função'],answer:1,why:'print é exibição. return entrega o resultado para o código que chamou a função.'},
{type:'predict',q:'Qual resultado será mostrado?',code:'def dobro(n):\n    return n * 2\n\nprint(dobro(6))',answer:'12',why:'A chamada passa 6 para n; a função devolve 6 * 2.'},
{type:'order',q:'Organize as linhas para definir e usar uma função de soma.',blocks:['return a + b','print(resultado)','def somar(a, b):','resultado = somar(2, 3)'],answer:[2,0,3,1],why:'Primeiro definimos a função, depois devolvemos a soma. Fora dela, chamamos a função, guardamos o resultado e mostramos com print.'}]},
{id:'strings',level:'medium',number:8,title:'Textos, índices e fatiamento',subtitle:'Strings também têm posições. Prepare-se para inverter palavras.',duration:'15 min',source:false,icon:'🔤',sections:[
{title:'1. String é uma sequência de caracteres',body:'Uma string é um texto entre aspas. Cada caractere tem um índice, começando em 0, assim como nas listas. `len(texto)` conta os caracteres.',code:'palavra = "PYTHON"\nprint(palavra[0])   # P\nprint(palavra[-1])  # N\nprint(len(palavra)) # 6'},
{title:'2. Fatiamento',body:'O fatiamento escolhe um trecho: `texto[inicio:fim]`. O início entra e o fim não. `texto[1:]` pega do índice 1 até o final. `texto[::-1]` devolve o texto invertido de forma direta.',code:'texto = "codigo"\nprint(texto[1:4])  # odi\nprint(texto[1:])   # odigo\nprint(texto[::-1]) # ogidoc'},
{title:'3. Transformações úteis',body:'`lower()` deixa minúsculo; `upper()` deixa maiúsculo; `strip()` remove espaços das pontas; `replace()` troca um trecho por outro. Strings são imutáveis: esses métodos devolvem um novo texto, não alteram o original.',code:'nome = "  python  "\nlimpo = nome.strip()\nprint(limpo.upper())  # PYTHON'}],questions:[
{type:'predict',q:'O que será exibido?',code:'texto = "casa"\nprint(texto[-1])',answer:'a',why:'O índice -1 acessa o último caractere.'},
{type:'predict',q:'Qual é a saída?',code:'palavra = "abc"\nprint(palavra[::-1])',answer:'cba',why:'O passo -1 percorre a sequência de trás para frente.'},
{type:'mcq',q:'Em texto[1:4], o índice 4...',options:['É incluído','Não é incluído','É sempre o último caractere','É o primeiro caractere'],answer:1,why:'O início é incluído e o limite final é excluído.'}]},
{id:'logictools',level:'medium',number:9,title:'Contadores, acumuladores e laços aninhados',subtitle:'A lógica que aparece quando o exercício fica maior.',duration:'17 min',source:false,icon:'🧮',sections:[
{title:'1. Contador',body:'Um contador acompanha quantas vezes algo aconteceu. É comum começar em zero e somar 1 dentro do laço.',code:'contador = 0\nfor numero in [4, 7, 2]:\n    contador = contador + 1\nprint(contador)  # 3'},
{title:'2. Acumulador',body:'Um acumulador guarda um total que vai sendo atualizado. Para somar vários números, começa em 0 e adiciona cada valor.',code:'total = 0\nfor numero in [4, 7, 2]:\n    total = total + numero\nprint(total)  # 13'},
{title:'3. Laços aninhados',body:'Um laço aninhado é um laço dentro de outro. Para cada volta do laço de fora, o laço de dentro executa todas as suas voltas. Isso é útil para tabelas, matrizes e combinações.',code:'for linha in range(2):\n    for coluna in range(3):\n        print(linha, coluna)'}],questions:[
{type:'predict',q:'Qual será o total?',code:'total = 0\nfor n in [2, 3, 5]:\n    total += n\nprint(total)',answer:'10',why:'O acumulador soma 2 + 3 + 5.'},
{type:'mcq',q:'O que faz um contador?',options:['Guarda o total de uma soma','Conta quantas vezes algo acontece','Inverte uma palavra','Ordena uma lista'],answer:1,why:'Contador acompanha quantidade de ocorrências ou repetições.'},
{type:'mcq',q:'Em dois laços range(2) e range(3) um dentro do outro, quantas execuções do print acontecem?',options:['2','3','5','6'],answer:3,why:'O laço de dentro executa 3 vezes para cada uma das 2 voltas do laço externo: 2 × 3 = 6.'}]},
{id:'recursion',level:'hard',number:10,title:'Funções recursivas: uma função chama a si mesma',subtitle:'Entenda os dois pilares da recursão e como evitar chamadas sem fim.',duration:'20 min',source:true,sourceLabel:'Aula 13 — Funções Recursivas',icon:'🪞',sections:[
{title:'1. O que é recursividade?',body:'Uma função recursiva é uma função que chama a si mesma para resolver uma versão menor do mesmo problema. Em vez de repetir com `for` ou `while`, ela divide a tarefa em etapas menores.',code:'def contagem(n):\n    if n == 0:       # caso base\n        print("Fim")\n    else:\n        print(n)\n        contagem(n - 1)\n\ncontagem(3)'},
{title:'2. Os dois pilares da recursão',body:'Toda recursão correta precisa de duas partes. Caso base: a condição que encerra as chamadas. Passo recursivo: a chamada da própria função que aproxima o problema do caso base. Sem caso base, pode haver chamadas sem fim e erro de recursão.',box:'Pergunta obrigatória: “O que faz essa função parar?” Se você não consegue responder, revise o caso base.',boxType:'yellow',code:'def exemplo(n):\n    if n <= 0:       # 1. Caso base\n        return\n    exemplo(n - 1)   # 2. Passo recursivo'},
{title:'3. Por que a função precisa diminuir o problema?',body:'A chamada recursiva precisa caminhar em direção ao caso base. No exemplo, n diminui 1 a cada chamada: 3 → 2 → 1 → 0. Quando chega a 0, a função para de chamar a si mesma.',code:'def contagem(n):\n    if n <= 0:\n        return\n    print(n)\n    contagem(n - 1)\n\ncontagem(3)  # 3, 2, 1'},
{title:'4. Quando usar recursão?',body:'Use quando o problema puder ser dividido naturalmente em subproblemas parecidos, como busca binária, árvores e navegação por pastas. Evite quando uma repetição simples com `for` ou `while` for mais eficiente ou quando a profundidade puder ficar muito grande. Cada chamada ocupa espaço na memória.',box:'Recursão não é automaticamente melhor. O objetivo é escolher a ferramenta que deixa a solução clara e segura.',boxType:'green'}],questions:[
{type:'mcq',q:'O que é uma função recursiva?',options:['Uma função que nunca termina','Uma função que chama a si mesma','Uma lista dentro de outra lista','Um comando para imprimir'],answer:1,why:'A característica da recursão é a própria função realizar uma nova chamada a si mesma.'},
{type:'mcq',q:'Quais são os dois pilares da recursão?',options:['print e input','for e while','Caso base e passo recursivo','Lista e variável'],answer:2,why:'Caso base encerra; passo recursivo aproxima o problema do encerramento.'},
{type:'predict',q:'Quantas vezes o print é executado?',code:'def contar(n):\n    if n == 0:\n        return\n    print(n)\n    contar(n - 1)\n\ncontar(3)',answer:'3',why:'São impressos 3, 2 e 1. Ao chegar em 0, o caso base encerra.'}]},
{id:'factorial',level:'hard',number:11,title:'Recursão na prática: o fatorial',subtitle:'O exemplo clássico da aula e a pilha de chamadas explicada sem mistério.',duration:'18 min',source:true,sourceLabel:'Aula 13 — Exemplo 1: O Clássico Fatorial',icon:'🧠',sections:[
{title:'1. O que é fatorial?',body:'O fatorial de um número inteiro não negativo é a multiplicação dele por todos os inteiros positivos menores até 1. Por exemplo: 5! = 5 × 4 × 3 × 2 × 1 = 120. Por definição, 0! também é 1.',code:'5! = 5 * 4 * 3 * 2 * 1\n5! = 120\n\n0! = 1\n1! = 1'},
{title:'2. Transformando em recursão',body:'A ideia matemática é: fatorial(n) = n × fatorial(n - 1). O caso base é quando n chega a 1 ou 0: devolvemos 1. No passo recursivo, multiplicamos n pelo resultado da chamada menor.',code:'def fatorial(n):\n    if n <= 1:       # caso base\n        return 1\n    else:            # passo recursivo\n        return n * fatorial(n - 1)\n\nprint(fatorial(5))  # 120'},
{title:'3. A pilha de chamadas (Call Stack)',body:'Quando fatorial(5) é chamada, ela espera fatorial(4). A chamada 4 espera 3; 3 espera 2; 2 espera 1. Quando fatorial(1) devolve 1, as chamadas começam a terminar de trás para frente: 2 × 1 = 2; 3 × 2 = 6; 4 × 6 = 24; 5 × 24 = 120.',code:'fatorial(5) espera 5 * fatorial(4)\nfatorial(4) espera 4 * fatorial(3)\nfatorial(3) espera 3 * fatorial(2)\nfatorial(2) espera 2 * fatorial(1)\nfatorial(1) devolve 1\n\nVoltando: 1 → 2 → 6 → 24 → 120',box:'Imagine uma pilha de pratos: você coloca um chamado sobre o outro. Só começa a retirar quando chega ao caso base.',boxType:'green'}],questions:[
{type:'predict',q:'Quanto vale fatorial(4)?',code:'def fatorial(n):\n    if n <= 1:\n        return 1\n    return n * fatorial(n - 1)\n\nprint(fatorial(4))',answer:'24',why:'4 × 3 × 2 × 1 = 24.'},
{type:'mcq',q:'No fatorial recursivo, por que fatorial(1) devolve 1?',options:['Porque é o caso base','Porque Python não aceita multiplicação','Porque return só aceita 1','Porque o laço terminou'],answer:0,why:'O caso base encerra a recursão e fornece o valor a partir do qual as chamadas voltam.'},
{type:'mcq',q:'Na pilha de chamadas, o que acontece depois que o caso base retorna?',options:['O programa apaga tudo','As chamadas pendentes terminam de trás para frente','A função chama fatorial(5) novamente','O Python reinicia'],answer:1,why:'As chamadas aguardavam o resultado da chamada menor. Quando ele chega, cada uma termina.'}]},
{id:'reverse',level:'hard',number:12,title:'Recursão na prática: inverter um texto',subtitle:'Entenda o exemplo da aula: tirar a primeira letra e colocá-la no final.',duration:'18 min',source:true,sourceLabel:'Aula 13 — Exemplo de inversão de texto',icon:'🔄',sections:[

function renderLevel(level){document.getElementById('main').innerHTML=`<div class="page"><div class="lesson-page-head"><button class="back-btn" onclick="navigate('paths')">←</button><div><div class="eyebrow">Trilha ${levelInfo[level].name}</div><h1 style="margin:0">${levelInfo[level].emoji} Nível ${levelInfo[level].name}</h1></div></div><p class="muted">${levelInfo[level].desc}</p><div class="lesson-list">${lessons.filter(l=>l.level===level).map(l=>lessonCard(l)).join('')}</div></div>`}
function lessonCard(l){return `<article class="lesson-card"><div class="lesson-number">${l.number.toString().padStart(2,'0')}</div><div><h3>${l.icon} ${l.title}</h3><p>${l.subtitle}</p><div class="lesson-meta"><span class="tag">${levelInfo[l.level].name}</span><span class="tag">⏱ ${l.duration}</span>${l.source?'<span class="tag source">Aula enviada</span>':'<span class="tag extra">Complemento</span>'}</div></div><div class="lesson-action">${state.done.includes(l.id)?'<span class="checkmark">✓</span>':''}<button class="btn btn-outline" onclick="openLesson('${l.id}')">${state.done.includes(l.id)?'Revisar':'Começar'} →</button></div></article>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openLesson(id){currentLesson=lessons.find(l=>l.id===id);if(!currentLesson)return;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById('sidebar').classList.remove('open');renderLesson()}
function renderLesson(){const l=currentLesson;const doneCount=l.questions.filter((q,i)=>state.answered.includes(l.id+'-'+i)).length;
 document.getElementById('main').innerHTML=`<div class="page"><div class="lesson-page-head"><button class="back-btn" onclick="renderLevel('${l.level}')">←</button><div><div class="eyebrow">${levelInfo[l.level].name} · Aula ${l.number}</div><h1 style="font-size:25px;margin:0">${l.title}</h1></div></div><section class="lesson-hero"><div class="eyebrow">${l.source?l.sourceLabel:'Complemento para a prova'}</div><h1>${l.icon} ${l.title}</h1><p>${l.subtitle} Leia uma parte, teste o exemplo e depois faça os desafios. Você não precisa decorar sem entender.</p></section><div class="lesson-layout"><div class="lesson-content"><section class="content-card"><div class="eyebrow">Explicação passo a passo</div><h2>Vamos por partes</h2>${l.sections.map((s,i)=>`<div style="margin-top:19px"><h3>${s.title}</h3><p>${s.body}</p>${s.box?`<div class="concept ${s.boxType||''}">💡 ${s.box}</div>`:''}${s.code?codeBox(s.code):''}</div>`).join('')}</section><section class="content-card" id="exercises"><div class="eyebrow">Hora de praticar</div><h2>Desafios da aula</h2><p class="muted">Acertou? Você ganha 5 XP por exercício. Leia a explicação mesmo quando acertar.</p><div class="progress" style="margin:12px 0 18px"><span style="width:${doneCount/l.questions.length*100}%"></span></div>${l.questions.map((q,i)=>exerciseHTML(l,q,i)).join('')}</section></div><aside class="side-panel"><div class="completion-box"><div class="eyebrow">Seu progresso</div><h3>${doneCount}/${l.questions.length} desafios resolvidos</h3><p>Faça todos os desafios e marque a aula como concluída para ganhar mais 20 XP.</p><button class="btn btn-primary" style="width:100%" onclick="finishLesson('${l.id}')">${state.done.includes(l.id)?'✓ Aula concluída':'Concluir aula'}</button></div><div class="side-tip"><strong>🐍 Dica da cobrinha</strong>Explique o código com suas próprias palavras. Se conseguir explicar sem copiar, você está entendendo de verdade.</div><div class="panel"><h3>Como estudar esta aula</h3><p class="small muted" style="margin:0">1. Leia a explicação.<br>2. Observe o exemplo.<br>3. Tente responder sem olhar.<br>4. Reveja o erro e tente de novo.</p></div></aside></div></div>`;

function codeBox(code){return `<div class="codebox"><div class="code-top"><span>🐍 EXEMPLO PYTHON</span><button class="copy-btn" onclick="copyCode(this)">Copiar código</button></div><pre>${esc(code)}</pre></div>`}
function exerciseHTML(l,q,i){const key=l.id+'-'+i,answered=state.answered.includes(key);let body='';if(q.type==='mcq'){body=`<div class="option-list">${q.options.map((o,j)=>`<button class="option" onclick="answerMCQ('${l.id}',${i},${j})">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div>`}else if(q.type==='predict'){body=`${q.code?codeBox(q.code):''}<div class="answer-row"><input class="answer-input" id="answer-${key}" placeholder="Digite a saída esperada..." ${answered?'disabled':''}><button class="btn btn-dark" onclick="answerText('${l.id}',${i})" ${answered?'disabled':''}>Conferir</button></div>`}else if(q.type==='text'){body=`<input class="answer-input" id="answer-${key}" placeholder="Sua resposta..." ${answered?'disabled':''}><div class="exercise-actions"><button class="btn btn-dark" onclick="answerText('${l.id}',${i})">Conferir</button></div>`}else if(q.type==='order'){body=`<div class="order-pool">${q.blocks.map((b,j)=>`<button class="order-choice" id="order-${key}-${j}" onclick="chooseOrder('${l.id}',${i},${j})">${esc(b)}</button>`).join('')}</div><div class="small muted" style="margin-top:10px">Sua sequência:</div><div class="order-picked" id="picked-${key}">${(orderSelections[key]||[]).map(j=>`<span>${esc(q.blocks[j])}</span>`).join('')||'<small class="muted">Toque nos blocos na ordem correta.</small>'}</div><div class="exercise-actions"><button class="tiny-btn" onclick="undoOrder('${l.id}',${i})">↶ Desfazer último</button><button class="btn btn-dark" onclick="checkOrder('${l.id}',${i})">Conferir ordem</button></div>`}return `<div class="exercise-card ${answered?'correct':''}" id="exercise-${key}"><div class="exercise-head"><span>Desafio ${i+1} · ${q.type==='mcq'?'Escolha':q.type==='predict'?'Preveja a saída':q.type==='order'?'Organize o código':'Responda'}</span>${answered?'<span class="tag source">✓ Resolvido</span>':'<span class="tag">+5 XP</span>'}</div><p>${q.q}</p>${body}<div class="feedback ${answered?'good':''}" id="feedback-${key}">${answered?'Muito bem! Desafio já contabilizado.':(q.hint?`Dica: ${q.hint}`:'')}</div></div>`}
function markAnswer(id,i,ok,message,why){const key=id+'-'+i;const el=document.getElementById('exercise-'+key);const fb=document.getElementById('feedback-'+key);if(ok){if(!state.answered.includes(key)){state.answered.push(key);state.xp+=5;save()}el.classList.remove('wrong');el.classList.add('correct');fb.className='feedback good';fb.innerHTML='✅ '+message+' '+why;renderLessonKeepScroll()}else{el.classList.add('wrong');fb.className='feedback bad';fb.textContent='Ainda não! '+message+' Tente novamente. Leia a dica e olhe cada linha.'}}
function renderLessonKeepScroll(){const y=window.scrollY;renderLesson();window.scrollTo(0,y)}
function answerMCQ(id,i,j){const l=lessons.find(x=>x.id===id),q=l.questions[i],key=id+'-'+i;if(state.answered.includes(key))return;const card=document.getElementById('exercise-'+key);card.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(k===q.answer)b.classList.add('selected')});if(j===q.answer)markAnswer(id,i,true,'Resposta correta!',q.why);else{card.classList.add('wrong');const fb=document.getElementById('feedback-'+key);fb.className='feedback bad';fb.textContent='Não foi dessa vez. '+q.why+' Tente novamente depois de revisar.';card.querySelectorAll('.option').forEach(b=>b.disabled=false);}}
function answerText(id,i){const l=lessons.find(x=>x.id===id),q=l.questions[i],key=id+'-'+i,input=document.getElementById('answer-'+key);if(!input)return;const val=input.value.trim().replace(/^['"]|['"]$/g,'').replace(/\s+/g,' ').toLowerCase();let ans=String(q.answer).trim().replace(/^['"]|['"]$/g,'').replace(/\s+/g,' ').toLowerCase();if(val===ans|| (q.type==='predict'&&val.replace(/,/g,'')===ans.replace(/,/g,''))){input.disabled=true;markAnswer(id,i,true,'Isso aí!',q.why)}else{const fb=document.getElementById('feedback-'+key);fb.className='feedback bad';fb.textContent='Quase! Revise o código e tente novamente. Dica: acompanhe a variável linha por linha.'}}
function chooseOrder(id,i,j){const l=lessons.find(x=>x.id===id),key=id+'-'+i;if(state.answered.includes(key))return;let a=orderSelections[key]||[];if(a.includes(j))return;a.push(j);orderSelections[key]=a;const picked=document.getElementById('picked-'+key);picked.innerHTML=a.map(n=>`<span>${esc(l.questions[i].blocks[n])}</span>`).join('');document.getElementById('order-'+key+'-'+j).classList.add('used')}
function undoOrder(id,i){const l=lessons.find(x=>x.id===id),key=id+'-'+i;if(state.answered.includes(key))return;let a=orderSelections[key]||[];let j=a.pop();if(j!==undefined)document.getElementById('order-'+key+'-'+j)?.classList.remove('used');document.getElementById('picked-'+key).innerHTML=a.map(n=>`<span>${esc(l.questions[i].blocks[n])}</span>`).join('')||'<small class="muted">Toque nos blocos na ordem correta.</small>'}
function checkOrder(id,i){const l=lessons.find(x=>x.id===id),q=l.questions[i],key=id+'-'+i;const a=orderSelections[key]||[];if(a.join(',')===q.answer.join(',')){markAnswer(id,i,true,'Sequência perfeita!',q.why)}else{const fb=document.getElementById('feedback-'+key);fb.className='feedback bad';fb.textContent='A ordem ainda não está certa. Pense: primeiro define, depois verifica, executa e chama. Você pode desfazer e tentar de novo.'}}
function finishLesson(id){if(state.done.includes(id)){toast('Aula já concluída. Revise quando quiser!');return}const l=lessons.find(x=>x.id===id);const count=l.questions.filter((q,i)=>state.answered.includes(id+'-'+i)).length;if(count<l.questions.length){toast(`Faltam ${l.questions.length-count} desafio(s). Faça todos primeiro!`);document.getElementById('exercises').scrollIntoView({behavior:'smooth'});return}state.done.push(id);state.xp+=20;save();toast('Aula concluída! +20 XP 🎉');renderLessonKeepScroll()}
function copyCode(btn){const code=btn.parentElement.nextElementSibling.textContent;navigator.clipboard?.writeText(code).then(()=>toast('Código copiado!')).catch(()=>toast('Selecione e copie o código manualmente.'))}
function renderNotebook(){const groups=[['🧱 Fundamentos',[['print(x)','Mostra x na tela.'],['input()','Recebe uma entrada como texto.'],['int(x) / float(x)','Converte para número inteiro ou decimal.'],['str(x)','Converte para texto.'],['type(x)','Mostra o tipo do valor.'],['= / ==','Atribui um valor / compara igualdade.']]],['🚦 Decisões e repetição',[['if / elif / else','Cria caminhos de decisão.'],['for x in range(n)','Repete n vezes: de 0 até n-1.'],['while condição','Repete enquanto a condição for verdadeira.'],['break','Encerra o laço.'],['continue','Pula para a próxima repetição.'],['and / or / not','E / OU / NÃO lógico.']]],['🧺 Listas',[['append(x)','Adiciona x no final.'],['insert(i, x)','Insere x no índice i.'],['extend(lista)','Adiciona vários elementos.'],['pop(i)','Remove e devolve item pela posição.'],['remove(x)','Remove a primeira ocorrência do valor x.'],['clear()','Esvazia a lista.'],['index(x) / count(x)','Índice da primeira ocorrência / quantidade.'],['sort() / reverse()','Ordena / inverte a ordem atual.'],['len() / sum()','Quantidade / soma dos valores.'],['min() / max() / copy()','Menor / maior / cópia superficial.'],['lista[a:b] / lista[::-1]','Fatiamento / sequência invertida.']]],['⚙️ Funções e recursão',[['def nome():','Define uma função.'],['nome()','Chama/executa a função.'],['return valor','Devolve um resultado.'],['Parâmetro','Variável que recebe informação na definição.'],['Argumento','Valor passado na chamada.'],['Caso base','Condição que encerra a recursão.'],['Passo recursivo','Chamada da função a si mesma com problema menor.']]]];document.getElementById('main').innerHTML=`<div class="page"><div class="eyebrow">Consulta rápida</div><h1>📒 Cola de Python</h1><p class="muted">Um resumo para revisar. Não é para decorar sem entender: use para lembrar e depois pratique.</p>${groups.map(g=>`<div class="section-head"><div><h2>${g[0]}</h2></div></div><div class="book-grid">${g[1].map(x=>`<div class="book-item"><code>${esc(x[0])}</code><p>${x[1]}</p></div>`).join('')}</div>`).join('')}<div class="content-card" style="margin-top:18px"><h3>⚠️ Pegadinhas que merecem atenção</h3><ul><li>Índice de lista e texto começa em <strong>0</strong>.</li><li>&grave;range(5)&grave; para antes do 5.</li><li>&grave;input()&grave; entrega texto; converta para número antes de somar numericamente.</li><li>&grave;print()&grave; mostra; &grave;return&grave; devolve.</li><li>&grave;sort()&grave; ordena; &grave;reverse()&grave; só inverte a ordem atual.</li><li>Recursão precisa de caso base e de um passo que caminhe até ele.</li></ul></div></div>`}
function renderLab(){document.getElementById('main').innerHTML=`<div class="page"><div class="eyebrow">Mão na massa</div><h1>💻 Laboratório Python</h1><p class="muted">Escreva um código e execute Python de verdade no navegador. A primeira execução pode precisar baixar o interpretador (internet necessária).</p><div class="sim-grid"><section class="sim-card" style="grid-column:1/-1"><div class="panel-head"><h3>Seu editor</h3><select class="select" id="labExample" onchange="loadLabExample(this.value)"><option value="hello">Escolha um exemplo...</option><option value="variables">Variáveis e print</option><option value="for">Laço for</option><option value="while">Laço while</option><option value="list">Lista e métodos</option><option value="function">Função</option><option value="factorial">Fatorial recursivo</option><option value="reverse">Inverter texto</option></select></div><textarea class="editor" id="pythonCode" spellcheck="false">nome = "Estudante"\nfor numero in range(1, 4):\n    print("Olá", nome, numero)</textarea><div class="toolbar" style="margin-top:10px"><button class="btn btn-primary" onclick="runPython()">▶ Executar código</button><button class="btn btn-outline" onclick="clearOutput()">Limpar saída</button><span class="small muted" id="pythonStatus">Interpretador ainda não carregado.</span></div><div class="output-label">Saída do programa</div><div class="output" id="pythonOutput">A saída aparecerá aqui...</div></section><section class="sim-card"><h3>🧪 Experimente mudar</h3><p class="small muted">Troque o nome, os números ou a condição e execute novamente. Observe como a saída muda.</p><div class="concept green">Teste: mude range(1, 4) para range(1, 6). Quantas linhas aparecem?</div></section><section class="sim-card"><h3>🧯 Se der erro...</h3><p class="small muted">Leia a última linha da mensagem. Ela costuma indicar o tipo do erro. Confira parênteses, aspas, dois-pontos e indentação.</p><div class="concept yellow">Erro não significa que você é ruim. Programadores passam boa parte do tempo encontrando e corrigindo erros.</div></section></div></div>`}
const labExamples={hello:'nome = "Estudante"\nfor numero in range(1, 4):\n    print("Olá", nome, numero)',variables:'nome = "Ana"\nidade = 18\nprint("Nome:", nome)\nprint("Ano que vem:", idade + 1)',for:'for numero in range(1, 6):\n    print(numero)',while:'contador = 1\nwhile contador <= 3:\n    print(contador)\n    contador += 1',list:'frutas = ["maçã", "banana"]\nfrutas.append("uva")\nfrutas.remove("banana")\nprint(frutas)',function:'def somar(a, b):\n    return a + b\n\nresultado = somar(10, 5)\nprint(resultado)',factorial:'def fatorial(n):\n    if n <= 1:\n        return 1\n    return n * fatorial(n - 1)\n\nprint(fatorial(5))',reverse:'def inverter_texto(texto):\n    if len(texto) <= 1:\n        return texto\n    return inverter_texto(texto[1:]) + texto[0]\n\nprint(inverter_texto("algoritmo"))'};
function loadLabExample(v){document.getElementById('pythonCode').value=labExamples[v]||labExamples.hello}
function clearOutput(){document.getElementById('pythonOutput').textContent='Saída limpa.'}
async function ensurePyodide(){if(pyodide)return pyodide;if(pyodideLoading)throw new Error('O interpretador ainda está carregando.');pyodideLoading=true;document.getElementById('pythonStatus').textContent='Carregando Python...';try{if(!window.loadPyodide){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js';s.onload=resolve;s.onerror=()=>reject(new Error('Não foi possível baixar o interpretador. Verifique sua internet.'));document.head.appendChild(s)})}pyodide=await window.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});return pyodide}catch(e){throw e}finally{pyodideLoading=false}}
async function runPython(){const out=document.getElementById('pythonOutput'),status=document.getElementById('pythonStatus'),code=document.getElementById('pythonCode').value;out.textContent='Executando...';try{const py=await ensurePyodide();let captured='';py.setStdout({batched:s=>captured+=s+'\n'});py.setStderr({batched:s=>captured+='ERRO: '+s+'\n'});try{await py.runPythonAsync(code);out.textContent=captured.trim()||'(O código terminou sem exibir nada. Use print() para mostrar uma saída.)';status.textContent='Python carregado e pronto!'}catch(e){out.textContent=captured+(e.message||String(e));status.textContent='O código apresentou um erro.'}}catch(e){out.textContent='Não consegui carregar o interpretador Python.\n\nMotivo: '+e.message+'\n\nConfira sua conexão com a internet e tente novamente. As aulas e os exercícios interativos continuam funcionando sem o interpretador.';status.textContent='Interpretador indisponível.'}}
function renderSimulator(){document.getElementById('main').innerHTML=`<div class="page"><div class="eyebrow">Veja o que acontece nos bastidores</div><h1>🧠 Entenda por dentro</h1><p class="muted">Em vez de só ler o código, avance passo a passo e veja como o computador pensa.</p><div class="sim-grid"><section class="sim-card"><h3>📚 Pilha de chamadas do fatorial</h3><p class="small muted">Aperte avançar para ver as chamadas entrando e depois voltando.</p><div class="toolbar"><button class="btn btn-primary" onclick="factorialStep(-1)">↺ Reiniciar</button><button class="btn btn-dark" onclick="factorialStep(1)">Próximo passo →</button></div><div class="stack-visual" id="factorialStack"></div><div class="concept" id="factorialExplain">Começamos chamando fatorial(4). Cada chamada espera o resultado da próxima.</div></section><section class="sim-card"><h3>🔁 for x while: qual a diferença?</h3><p class="small muted">Os dois repetem. A pergunta é: você sabe a quantidade de repetições ou depende de uma condição?</p><div class="content-card" style="padding:13px;margin-top:12px"><strong>for</strong><p class="small muted">Use quando percorre uma sequência ou sabe a quantidade.</p><code>for i in range(3):</code></div><div class="content-card" style="padding:13px;margin-top:10px"><strong>while</strong><p class="small muted">Use enquanto uma condição continuar verdadeira.</p><code>while senha != "123":</code></div></section><section class="sim-card" style="grid-column:1/-1"><h3>🧩 Rastreador de variável</h3><p class="small muted">Veja o valor mudar a cada linha do programa.</p><div class="toolbar"><button class="btn btn-primary" onclick="traceStep(-1)">↺ Reiniciar</button><button class="btn btn-dark" onclick="traceStep(1)">Executar próxima linha</button></div><div class="codebox"><div class="code-top"><span>CÓDIGO</span><span>Passo <b id="traceNum">0</b>/4</span></div><pre id="traceCode">contador = 2\ncontador = contador + 3\ncontador = contador * 2\nprint(contador)</pre></div><div class="result-banner" style="margin-bottom:0"><span class="muted">Valor atual de contador</span><strong id="traceValue">—</strong><p id="traceMessage" class="muted small">Execute a primeira linha.</p></div></section></div></div>`;factorialStep(-1);traceStep(-1)}
let factStep=0,traceN=0;function factorialStep(dir){if(dir<0)factStep=0;else factStep=Math.min(8,factStep+1);const steps=[{items:['fatorial(4)'],msg:'A primeira chamada fica esperando o resultado de fatorial(3).'}, {items:['fatorial(4)','fatorial(3)'],msg:'Agora fatorial(3) espera fatorial(2).'}, {items:['fatorial(4)','fatorial(3)','fatorial(2)'],msg:'A chamada de 2 espera fatorial(1).'}, {items:['fatorial(4)','fatorial(3)','fatorial(2)','fatorial(1)'],msg:'Chegamos ao caso base. fatorial(1) devolve 1.'}, {items:['fatorial(4) ← 24','fatorial(3) ← 6','fatorial(2) ← 2','fatorial(1) → 1'],msg:'A pilha começa a voltar: fatorial(2) devolve 2 × 1 = 2.'}, {items:['fatorial(4) ← 24','fatorial(3) ← 6','fatorial(2) → 2'],msg:'fatorial(3) devolve 3 × 2 = 6.'}, {items:['fatorial(4) ← 24','fatorial(3) → 6'],msg:'fatorial(4) devolve 4 × 6 = 24.'}, {items:['fatorial(4) → 24'],msg:'A primeira chamada terminou. Resultado final: 24.'}, {items:['Resultado final: 24'],msg:'Todas as chamadas foram concluídas.'}];const s=steps[factStep];document.getElementById('factorialStack').innerHTML=s.items.map((x,i)=>`<div class="stack-item ${factStep>=4&&i===s.items.length-1?'base':''}">${x}</div>`).join('');document.getElementById('factorialExplain').textContent=s.msg}
function traceStep(dir){if(dir<0)traceN=0;else traceN=Math.min(4,traceN+1);const values=['—','2','5','10','10'];const msgs=['Execute a primeira linha.','contador recebe 2.','Agora soma 3: 2 + 3 = 5.','Multiplica por 2: 5 × 2 = 10.','print(contador) mostra 10 na tela.'];document.getElementById('traceNum').textContent=traceN;document.getElementById('traceValue').textContent=values[traceN];document.getElementById('traceMessage').textContent=msgs[traceN]}
function renderPlan(){document.getElementById('main').innerHTML=`<div class="page"><div class="eyebrow">14 dias de preparação</div><h1>📅 Plano até a prova</h1><p class="muted">A prova é em <strong>28 de novembro de 2026</strong>. Use os dias até 27/11 para aprender, revisar e descansar um pouco antes da prova.</p><div class="content-card"><div class="panel-head"><h3>Seu calendário de missões</h3><span class="tag source">14 a 27 de novembro</span></div>${planDays.map((d,i)=>`<div class="resume-row"><div class="resume-icon">${state.planDone.includes(i)?'✅':'📌'}</div><div class="resume-info"><strong>Dia ${i+1} · ${d[0]}</strong><span>${d[1]}</span></div><button class="btn ${state.planDone.includes(i)?'btn-outline':'btn-primary'}" onclick="togglePlan(${i})">${state.planDone.includes(i)?'Feito ✓':'Concluir'}</button></div>`).join('')}</div><div class="content-card" style="margin-top:15px"><h3>⏱️ Rotina simples sugerida</h3><div class="book-grid"><div class="book-item"><code>15 min</code><p>Leia a explicação e anote o que não entendeu.</p></div><div class="book-item"><code>20 min</code><p>Faça os exercícios sem olhar a resposta.</p></div><div class="book-item"><code>10 min</code><p>Repita o código no Laboratório e mude os valores.</p></div><div class="book-item"><code>5 min</code><p>Explique em voz alta o que o código faz.</p></div></div></div><div class="concept yellow" style="margin-top:15px">Na véspera (27/11), faça o simulado e revise os erros. Não tente aprender tudo de madrugada: dormir também ajuda a memória.</div></div>`}
function togglePlan(i){if(state.planDone.includes(i))state.planDone=state.planDone.filter(x=>x!==i);else state.planDone.push(i);save();renderPlan()}
function renderMock(){mockAnswers={};mockSubmitted=false;document.getElementById('main').innerHTML=`<div class="page"><div class="eyebrow">Desafio final</div><h1>🏆 Simulado da prova</h1><p class="muted">12 questões misturadas, do básico à recursão. Faça sem consultar a cola para descobrir o que precisa revisar.</p><div class="stats"><div class="stat"><span class="stat-icon" style="background:#fff4d9">📝</span><div><strong>12</strong><span>questões</span></div></div><div class="stat"><span class="stat-icon" style="background:#e8faf4">🎯</span><div><strong>100</strong><span>pontos possíveis</span></div></div><div class="stat"><span class="stat-icon" style="background:#f0edff">🏅</span><div><strong>${state.mockBest}%</strong><span>melhor resultado</span></div></div><div class="stat"><span class="stat-icon" style="background:#fff0ed">⏱️</span><div><strong>15–20</strong><span>minutos</span></div></div></div><div id="mockArea">${mockQuestions.map((q,i)=>`<div class="mock-question"><div class="exercise-head"><span>Questão ${i+1} de 12</span><span class="tag">Múltipla escolha</span></div><h3>${q.q}</h3><div class="option-list">${q.o.map((o,j)=>`<button class="option" id="mock-${i}-${j}" onclick="selectMock(${i},${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="feedback" id="mock-feedback-${i}"></div></div>`).join('')}<button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="submitMock()">Finalizar simulado</button></div></div>`}
function selectMock(i,j){if(mockSubmitted)return;mockAnswers[i]=j;document.querySelectorAll(`[id^="mock-${i}-"]`).forEach(x=>x.classList.remove('selected'));document.getElementById(`mock-${i}-${j}`).classList.add('selected')}
function submitMock(){if(Object.keys(mockAnswers).length<mockQuestions.length){toast(`Responda às ${mockQuestions.length-Object.keys(mockAnswers).length} questão(ões) restantes.`);return}mockSubmitted=true;let score=0;mockQuestions.forEach((q,i)=>{const correct=mockAnswers[i]===q.a;if(correct)score++;document.getElementById(`mock-${i}-${q.a}`).classList.add('selected');const fb=document.getElementById('mock-feedback-'+i);fb.className='feedback '+(correct?'good':'bad');fb.textContent=(correct?'✅ Correto. ':'❌ Revise. ')+q.e});const percent=Math.round(score/mockQuestions.length*100);state.mockBest=Math.max(state.mockBest,percent);state.xp+=score*2;save();const result=document.createElement('div');result.className='result-banner';result.innerHTML=`<div class="eyebrow">Resultado do simulado</div><strong>${percent}%</strong><h2>${score} de ${mockQuestions.length} acertos</h2><p>${percent>=80?'Mandou muito bem! Você está construindo uma ótima base. 🎉':percent>=60?'Bom caminho! Revise as questões erradas e tente novamente.':'Calma. O simulado mostrou exatamente o que precisamos treinar. Volte às aulas e tente de novo.'}</p><button class="btn btn-dark" onclick="navigate('paths')">Revisar as aulas</button> <button class="btn btn-outline" onclick="renderMock()">Refazer simulado</button>`;document.getElementById('mockArea').prepend(result);result.scrollIntoView({behavior:'smooth'})}
updateTop();renderHome();
</script>
